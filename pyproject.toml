[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "my-planner"
version = "0.2.0"
description = "Dahun 한 사람을 위한 텔레그램 AI 비서"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.173,<0.3",
    "python-telegram-bot>=21.6,<23",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "anyio>=4,<5",  # 두뇌 호출 시간 상한(fail_after). SDK도 쓴다
    "tzdata>=2024.1",  # Windows에는 IANA 시간대 DB가 없어 ZoneInfo("Asia/Seoul")가 실패한다
    "aiohttp>=3.14,<4",  # HTTP API (SP3-4). 같은 asyncio 루프에 AppRunner로 끼운다(S7)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.17.2,<0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
my_planner = ["store/migrations/*.sql", "harness/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# 린트 게이트: `ruff check src tests`. 규칙은 ruff 0.17의 기본 묶음 그대로다(select를 두지 않는다).
# 기본 묶음은 ruff 판마다 바뀌므로 dev 의존성에서 0.17로 묶어 둔다.
[tool.ruff]
target-version = "py312"
