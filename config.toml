# my-planner 설정 (Git에 넣는다. 개인값과 비밀값은 .env에 둔다)
# 시각은 "HH:MM" 형식, 시간대 기준이다.

timezone = "Asia/Seoul"
day_boundary = "04:00"   # 논리적 날짜의 하루 경계. 00:00~03:59는 전날이다.

# 회차 시각 (주말 = 토, 일)
[schedule.morning_brief]
weekday = "09:00"
weekend = "10:00"

[schedule.evening_checkin]
weekday = "17:30"
weekend = "18:00"

[schedule.review.week]
day = "sun"
time = "18:00"

# 일정 정리 알림 (SP9b): 아침은 오늘 일정, 밤은 내일 일정. 일정이 없는 날은 보내지 않는다
# 아침 04:00~11:50, 밤 18:00~23:50, 10분 단위. 앱 설정에서 바꾸면 그 값이 먼저다(app_state.digest_settings)
[schedule.digest]
morning = "07:30"
night = "21:30"
morning_on = true
night_on = true

[limits]
daily_brain_calls = 60          # 하루 두뇌 호출 상한
max_turns = 10                  # 호출당 턴 상한
daily_proactive_messages = 3    # 비서가 먼저 보내는 메시지 하루 상한
daily_event_reminders = 30      # 일정 알림 하루 상한(위 상한에 세지 않는다, SP9 5.3)
chat_resume_minutes = 30        # chat 대화 이어가기
plan_idle_hours = 2             # 계획 모드 유휴 만료
draft_ttl_days = 3              # 초안 만료
stale_message_hours = 6         # 이보다 오래된 메시지는 "몇 시간 전" 알림
input_max_chars = 8000          # 두뇌에 넘기는 입력 상한
brain_timeout_s = 300           # 두뇌 호출 한 번의 상한(초). 넘으면 오류로 보고 재시도 규칙을 따른다
daily_summaries = 15            # 앱 대화 요약 하루 상한(위 두뇌 호출 상한에도 센다, SP9 7.2)
rollup_user_messages = 30       # 한 대화의 사용자 메시지가 이보다 많아지면 요약 + 최근 줄로 새 세션(말아 넣기, SP9 7.4)
rollup_tail_lines = 6           # 말아 넣기·resume 실패 때 붙이는 최근 원문 줄 수
daily_photos = 100              # 하루(논리적 날짜) 사진 올리기 상한(SP10 5.1)
daily_photo_reads = 30          # 하루 사진 읽기 상한(SP10 5.4)

# 답장 창: 이 시각까지 답하면 같은 회차 대화로 잇는다
[limits.reply_window]
morning_brief_until = "12:00"   # 당일
evening_checkin_until = "04:00" # 다음 날
review_hours = 24

# 루프별 한계: 이 시각이 지나면 보내지 않는다
[limits.catchup_limit]
morning_brief_until = "12:00"   # 당일
evening_checkin_until = "04:00" # 다음 날
review_days = 3

# 라이프 매니저 보통 메시지(전문가 2명까지, SP15). 스파이크 S1 full2 판정(9초, 5턴)의 여유
[limits.manager_message]
max_turns = 12
brain_timeout_s = 300

# 서브에이전트(전문가) 6개가 도는 "전체 진단"(SP15). 스파이크 S1에서 잼(full6: 12초, 7턴, 가짜 도구)
[limits.full_diagnosis]
max_turns = 30
brain_timeout_s = 900

[retention]
log_days = 30       # 로그 보관 일수
backup_count = 14   # DB 백업 보관 개수

# HTTP API (SP3-4). 127.0.0.1에만 연다. 밖에서는 tailscale serve로만(Funnel은 쓰지 않는다)
[api]
enabled = true
host = "127.0.0.1"
port = 8787
cors_origins = ["https://my-planner-beige-eight.vercel.app", "https://my-planner-dashboard-seven.vercel.app"]  # 정확한 출처만. 운영 앱(SP5), 대시보드(19b)
max_body_kb = 64               # 다른 경로의 본문 상한. 사진 경로만 따로 5.5MiB(SP10 5.3)
max_photo_bytes = 5000000      # POST /photos의 사진 한 장 상한(SP10 5.3)

# 두뇌 CLI (2026-10-28 채팅 느림 진단). 메모리가 모자라면 CLI 첫 실행이 1분을 넘겨 SDK 기본 60초에 실패했다
[brain]
start_timeout_s = 180   # CLI 시작 대기(초). limits.brain_timeout_s보다 작아야 한다. 넘으면 다시 부르지 않고 대체 답
# 시작에 쓴 시간도 brain_timeout_s(300초) 안에 든다. 느리게 뜬 호출은 답할 시간이 그만큼 줄어든다
# cli_path는 기계마다 달라 config.local.toml에 둔다. 예: cli_path = "C:/my-planner-cli/claude.exe"

[notify]
default_primary = "app"   # app_state.notify_primary가 없을 때. 유효한 푸시 구독이 없으면 실제로는 텔레그램(7.3 D1a)

# 사진 (SP10). 바이트는 data/photos/에만
[photos]
reader = "claude"   # 사진 읽기(5.4). SP11이 "local"을 더한다
cleanup = true      # 하루 한 번 작업의 사진 정리(5.6). 020을 되돌릴 때 false(14장)
