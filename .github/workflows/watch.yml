name: watch

# 2시간마다 한 번(GitHub Free 분량): 하트비트 확인 + PAT 만료 알림(스펙 3.5, 4.2), 그다음 sweep(스펙 4.3).
# 스펙의 heartbeat·repair-sweep 둘을 Actions 분량 때문에 하나로 묶었다. Claude는 부르지 않는다.
# 쓰기(라벨, PR 닫기, repair.yml 부르기)는 REPAIR_PAT으로 한다(스펙 4.2).

on:
  schedule:
    - cron: '7 */2 * * *'  # 정각 혼잡을 피해 7분
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Heartbeat
        env:
          REPAIR_PAT: ${{ secrets.REPAIR_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          PAT_EXPIRES: ${{ vars.PAT_EXPIRES }}
          RELEASE_PAT_EXPIRES: ${{ vars.RELEASE_PAT_EXPIRES }}
          DEV_PAT_EXPIRES: ${{ vars.DEV_PAT_EXPIRES }}
        run: python .github/scripts/heartbeat_check.py
      # 하트비트 단계가 실패해도(텔레그램 등) sweep은 돈다
      - name: Sweep
        if: ${{ !cancelled() }}
        env:
          REPAIR_PAT: ${{ secrets.REPAIR_PAT }}
          AUTO_REPAIR: ${{ vars.AUTO_REPAIR }}
        run: python .github/scripts/sweep.py
