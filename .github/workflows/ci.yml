name: ci

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read  # already_green: 같은 SHA의 develop push 실행 찾기

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.filter.outputs.be }}
      workflow: ${{ steps.filter.outputs.workflow }}
      web: ${{ steps.filter.outputs.web }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      already_green: ${{ steps.green.outputs.already_green }}
    steps:
      - uses: actions/checkout@v4
      # main은 develop에서 이미 통과한 SHA로 빨리감기된다(배포 흐름 스펙 5.5). 그 SHA면 다시 테스트하지 않는다
      - name: Already green on develop
        id: green
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&event=push&branch=develop&status=success" \
            --jq '[.workflow_runs[] | select(.name == "ci")] | length') || n=0  # 조회 실패면 전부 돈다
          echo "already_green=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # push는 push 전 커밋과 비교한다. 없으면 develop push를 main과의 merge-base로 비교해 매번 다 돈다
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            be:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'requirements.lock'
              - 'pyproject.toml'
              - 'config.toml'
            workflow:
              - '.github/workflows/ci.yml'
            # web/shared/global.css와 DESIGN.md가 바뀌면 두 사본 시험(sync-design.test.mjs)이 돌아야 한다
            web:
              - 'web/app/**'
              - 'web/shared/**'
              - 'DESIGN.md'
            dashboard:
              - 'web/dashboard/**'
              - 'web/shared/**'
              - 'DESIGN.md'

  # be 작업은 둘로 나눈다. 작업 수준 `if:`에서는 matrix를 쓸 수 없고, 단계에서만 건너뛰면
  # Windows 러너가 떠서 분량을 쓰기 때문이다. 건너뛴 작업은 GitHub이 통과로 본다.
  be:
    name: be (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.already_green != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]" --no-deps
      - name: Lint
        run: ruff check src tests .github/scripts
      - name: Test
        run: python -m pytest -q

  # windows는 Actions 분량을 아끼려고 main·develop 푸시(BE 파일이 바뀐 경우), auto-repair/* 브랜치 PR,
  # ci.yml을 고친 PR, 수동 실행에서만 돈다. develop에서 통과한 SHA의 main 푸시는 건너뛴다.
  be-windows:
    name: be (windows-latest)
    needs: changes
    if: >-
      needs.changes.outputs.already_green != 'true'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && needs.changes.outputs.be == 'true')
      || (github.event_name == 'pull_request'
          && (startsWith(github.head_ref, 'auto-repair/')
              || needs.changes.outputs.workflow == 'true')))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]" --no-deps
      - name: Lint
        run: ruff check src tests .github/scripts
      - name: Test
        run: python -m pytest -q

  # 워크플로 문법·표현식·주입 검사(SP6 계획의 결정 6). 러너의 shellcheck로 run: 셸도 본다
  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.already_green != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  web-app:
    name: web-app
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.already_green != 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONNECT_SRC: https://*.example.ts.net
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  web-dashboard:
    name: web-dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' && needs.changes.outputs.already_green != 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONNECT_SRC: https://*.example.ts.net
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
