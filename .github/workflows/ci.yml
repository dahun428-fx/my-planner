name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.filter.outputs.be }}
      workflow: ${{ steps.filter.outputs.workflow }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            be:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'requirements.lock'
              - 'pyproject.toml'
            workflow:
              - '.github/workflows/ci.yml'
            web:
              - 'web/app/**'

  # be 작업은 둘로 나눈다. 작업 수준 `if:`에서는 matrix를 쓸 수 없고, 단계에서만 건너뛰면
  # Windows 러너가 떠서 분량을 쓰기 때문이다. 건너뛴 작업은 GitHub이 통과로 본다.
  be:
    name: be (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]" --no-deps
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest -q

  # windows는 Actions 분량을 아끼려고 main 푸시(BE 파일이 바뀐 경우), auto-repair/* 브랜치 PR,
  # ci.yml을 고친 PR, 수동 실행에서만 돈다.
  be-windows:
    name: be (windows-latest)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && needs.changes.outputs.be == 'true')
      || (github.event_name == 'pull_request'
          && (startsWith(github.head_ref, 'auto-repair/')
              || needs.changes.outputs.workflow == 'true'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]" --no-deps
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest -q

  web-app:
    name: web-app
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONNECT_SRC: https://*.example.ts.net
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
