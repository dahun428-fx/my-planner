name: signal

# 노트북을 거치지 않는 두 신호를 장애 이슈로 (스펙 3.1, 3.5). 판단은 signal_issue.py.
# - Vercel 커밋 상태 failure(main에 든 커밋만. develop 미리보기는 장애가 아니다) → vercel:<컨텍스트>
# - main 푸시의 ci 실패 → ci:main. already_green으로 건너뛴 main 실행은 success로 끝나 오지 않는다
# 이슈는 REPAIR_PAT으로 연다: incident 라벨이 repair.yml을 깨워야 한다(스펙 4.2).

on:
  status:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  signal:
    # 다른 상태(staging/be, success, develop 미리보기 등)는 러너를 띄우지 않는다
    if: >-
      (github.event_name == 'status'
       && github.event.state == 'failure'
       && startsWith(github.event.context, 'Vercel')
       && contains(github.event.branches.*.name, 'main'))
      || (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'failure'
       && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # 지문마다 한 줄: 같은 지문이 겹쳐 와도 이슈가 둘 열리지 않게
    concurrency:
      group: signal-${{ github.event_name == 'status' && github.event.context || 'ci' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Open or comment incident
        env:
          REPAIR_PAT: ${{ secrets.REPAIR_PAT }}
        run: python .github/scripts/signal_issue.py
